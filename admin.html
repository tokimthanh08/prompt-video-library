<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Quản lý Prompt</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="admin">
<header>
  <h1>🔐 Admin - Quản lý Prompt</h1>
  <a href="index.html" class="link-view">← Xem trang public</a>
</header>

<section id="auth-section" class="panel">
  <h2>1. Kết nối GitHub (chỉ làm 1 lần)</h2>
  <p class="hint">
    Token chỉ lưu trên máy bạn (localStorage), không ai thấy.
    Tạo token tại GitHub → Settings → Developer settings → Tokens (classic) → scope <code>repo</code>.
  </p>
  <label>GitHub Token</label>
  <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
  <label>Owner (username GitHub)</label>
  <input type="text" id="owner" placeholder="vd: tokimthanh08">
  <label>Repo name</label>
  <input type="text" id="repo" placeholder="vd: prompt-video-library">
  <label>Branch</label>
  <input type="text" id="branch" value="main">
  <button id="save-auth" class="btn-primary">💾 Lưu kết nối</button>
  <p id="auth-status" class="status"></p>
  <button id="logout-btn" class="btn-secondary hidden">🔓 Ngắt kết nối (xoá token khỏi máy)</button>
</section>

<section id="form-section" class="panel hidden">
  <h2>2. Thêm prompt mới</h2>

  <label>Tiêu đề *</label>
  <input type="text" id="f-title" placeholder="Catwalk váy lụa trắng">

  <label>Prompt tiếng Anh</label>
  <textarea id="f-en" rows="4" placeholder="A fashion model walking..."></textarea>

  <label>Prompt tiếng Việt</label>
  <textarea id="f-vi" rows="4" placeholder="Người mẫu bước catwalk..."></textarea>

  <label>Tags (cách nhau bằng dấu phẩy)</label>
  <input type="text" id="f-tags" placeholder="catwalk, silk, studio">

  <label>Collection (Phân loại) *</label>
  <select id="f-collection" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0f0f12; color: #fff; font-size: 16px; margin-bottom: 10px;">
    <option value="Quần">Quần</option>
    <option value="Áo">Áo</option>
    <option value="Đầm">Đầm (dài/ngắn)</option>
    <option value="Váy">Váy (dài/ngắn)</option>
  </select>

  <label>AI Model (không bắt buộc)</label>
  <input type="text" id="f-ai" placeholder="Runway Gen-3">

  <label>Video * (MP4/WebM, ≤ 5MB)</label>
  <input type="file" id="f-video" accept="video/mp4,video/webm">

  <label>Ảnh thumbnail (tùy chọn, để trống sẽ tự lấy frame đầu)</label>
  <input type="file" id="f-thumb" accept="image/*">

  <div class="progress hidden" id="progress">
    <div></div>
    <span class="progress-text"></span>
  </div>
  <p id="save-status" class="status"></p>

  <button id="btn-add" class="btn-primary">➕ Thêm prompt</button>
</section>

<section id="list-section" class="panel hidden">
  <h2>3. Danh sách prompt hiện có</h2>
  <div id="admin-list"></div>
</section>

<script src="admin.js"></script>
</body>
</html>
