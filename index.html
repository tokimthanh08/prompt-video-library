<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Thư viện Prompt Video</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🎬 Thư viện Prompt Video</h1>
  <div class="controls">
    <input type="search" id="search" placeholder="Tìm prompt, tag...">
    <select id="filter-collection">
      <option value="">Tất cả danh mục</option>
      <option value="Quần">Quần</option>
      <option value="Áo">Áo</option>
      <option value="Đầm">Đầm (dài/ngắn)</option>
      <option value="Váy">Váy (dài/ngắn)</option>
    </select>
  </div>
</header>
<main id="grid"></main>
<div id="toast" class="toast">Đã copy!</div>
<script src="app.js"></script>
</body>
</html>
